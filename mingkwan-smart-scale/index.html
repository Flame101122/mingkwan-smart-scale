async function tkFinish(){tkSync();if(!TK.plate)return toast('กรอกทะเบียนรถ');if(!TK.lines.length)return toast('ยังไม่มีรายการ');if(TK.lines.some(l=>l.net==null))return toast('ยังมีรายการรอชั่งรถเบา');
 const total=r2(TK.lines.reduce((a,l)=>a+l.amount,0));if(!await dlg('บันทึกการรับซื้อ ยอดรวม ฿'+f2(total)+' ?',{ok:'บันทึก'}))return;
 const{data:b,error}=await sb.from('bills').insert({seller_name:TK.seller||'ลูกค้าทั่วไป',note:'รถทะเบียน '+TK.plate,total}).select().single();if(error)throw error;
 const{error:e2}=await sb.from('bill_items').insert(TK.lines.map(l=>({bill_id:b.id,product_id:l.pid,product_name:l.name,price_per_kg:l.price,gross_kg:r2(l.heavy-l.light),tare_kg:l.deduct,impurity_pct:0,net_kg:l.net,amount:l.amount})));if(e2)throw e2;
 for(const l of TK.lines)for(const[pt,lb]of[[l.ph,' · รถหนัก'],[l.pl,' · รถเบา']])if(pt)await sb.from('bill_photos').insert({bill_id:b.id,path:pt,product_name:l.name+lb});
 await sb.from('truck_tickets').update({plate:TK.plate,seller_name:TK.seller||'ลูกค้าทั่วไป',lines:TK.lines,status:'done',bill_id:b.id,updated_at:new Date().toISOString()}).eq('id',TK.id);
 await loadB();if(await dlg('บันทึกบิล '+b.bill_no+' แล้ว ส่งให้ผู้จ่ายเงินเรียบร้อย',{ok:'🖨 พิมพ์ใบรับ',no:'ปิด'}))printBill(b.id);tkList()}
// ---------- dashboard / my bills ----------
function rDash(){const d=new Date();d.setHours(0,0,0,0);const bs=B.filter(b=>b.ts>=+d&&b.status!='void'&&b.status!='rejected'),M={};let net=0;
 bs.forEach(b=>b.lines.forEach(l=>{M[l.name]=(M[l.name]||0)+l.amount;net+=l.net}));const top=Object.entries(M).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=top[0]?.[1]||1,S_=(t,v,c)=>`<div class="stat"><span class="m">${t}</span><b${c?` style="color:${c}"`:''}>${v}</b></div>`;
 $('dash').innerHTML=`<div class="stats">${S_('บิลวันนี้',bs.length)}${S_('ยอดซื้อรวม (฿)',f2(bs.reduce((a,b)=>a+b.total,0)),'#16a34a')}${S_('น้ำหนักสุทธิ (กก.)',f2(net))}${S_('รอจ่ายเงิน',bs.filter(b=>b.status=='pending').length,'#f59e0b')}</div>
 <div class="card"><b>สินค้าที่รับซื้อวันนี้</b>${top.map(([n,v])=>`<div class="bar"><span>${esc(n)}</span><div><i style="width:${v/mx*100}%"></i></div><b>฿${f2(v)}</b></div>`).join('')||'<div class="m" style="padding:10px 0">ยังไม่มีรายการ</div>'}</div>`}
function rMine(){const st={pending:['รอจ่ายเงิน','#f59e0b'],approved:['จ่ายแล้ว','#16a34a'],rejected:['ถูกปฏิเสธ','#dc2626'],void:['ยกเลิก','#777']};
 $('mine').innerHTML='<div class="card" style="overflow-x:auto"><table><tr><th>เวลา</th><th>เลขที่</th><th>ผู้ขาย</th><th class="n">ยอด (฿)</th><th>สถานะ</th></tr>'+B.slice(0,80).map(b=>`<tr onclick="showBill('${b.id}')" style="cursor:pointer"><td>${new Date(b.ts).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}</td><td>${b.no}</td><td>${esc(b.seller)}</td><td class="n">${f2(b.total)}</td><td><span class="bd" style="background:${st[b.status][1]}">${st[b.status][0]}</span></td></tr>`).join('')+'</table></div>'}
// ---------- stock ----------
let STK=[];
async function rStock(){const{data,error}=await sb.from('stock_summary').select('*');if(error)return $('stock').innerHTML='<div class="card">โหลดสต็อกไม่ได้: '+esc(error.message)+'<br><span class="m">ตรวจว่า Run migrate3.sql แล้ว</span></div>';
 const M={};(data||[]).forEach(x=>M[x.product_id]=x);
 STK=P.map(p=>{const x=M[p.id]||{net_kg:0,cost:0},kg=+x.net_kg,c=+x.cost;return{...p,kg,avg:kg?c/kg:0,val:c}});
 $('stock').innerHTML='<div class="card"><input id="sq" placeholder="🔍 ค้นหาด้วยชื่อหรือรหัสสินค้า" oninput="stockTbl()"><div class="m" style="margin-top:6px">น้ำหนักรับเข้าสะสมจากบิลที่จ่ายเงินแล้ว (ยังไม่หักขายออก)</div></div><div class="card" style="overflow-x:auto"><table id="stt"></table></div>';stockTbl()}
function stockTbl(){const q=($('sq')?.value||'').toLowerCase(),r=STK.filter(x=>!q||x.name.toLowerCase().includes(q)||x.code.toLowerCase().includes(q));
 $('stt').innerHTML='<tr><th>รหัส</th><th>ชื่อสินค้า</th><th>หมวด</th><th>หน่วย</th><th class="n">น้ำหนักรับเข้า</th><th class="n">ต้นทุนเฉลี่ย ฿/กก.</th><th class="n">ราคาตั้ง ฿/กก.</th><th class="n">มูลค่า (฿)</th></tr>'+
 r.map(x=>`<tr><td>${esc(x.code)}</td><td style="background:${esc(x.color||'#eee')};color:#2b2b2b;font-weight:600">${esc(x.name)}</td><td>${esc(x.cat)}</td><td>กก.</td><td class="n">${f2(x.kg)}</td><td class="n">${f2(x.avg)}</td><td class="n">${f2(x.price)}</td><td class="n">${f2(x.val)}</td></tr>`).join('')+
 `<tr><th colspan="4">รวม</th><th class="n">${f2(r.reduce((a,x)=>a+x.kg,0))}</th><th></th><th></th><th class="n">${f2(r.reduce((a,x)=>a+x.val,0))}</th></tr>`}
// ---------- products ----------
function rProd(){$('prod').innerHTML=`<div class="card"><b>เพิ่มสินค้า</b><div class="row"><div><label>รหัส</label><input id="nc"></div><div><label>ชื่อ</label><input id="nn"></div><div><label>หมวด</label><input id="nk" placeholder="โลหะ"></div><div><label>สี</label><input id="nl" type="color" value="#e9ecef"></div><div><label>ราคา/กก.</label><input id="np" type="number" step="0.01"></div><button class="pri" onclick="addProd()">เพิ่ม</button></div></div>
 <div class="card"><table><tr><th>รหัส</th><th>ชื่อ</th><th class="n">฿/กก.</th><th class="n">฿/กรัม</th><th></th></tr>${P.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td class="n"><input type="number" step="0.01" value="${p.price}" style="width:90px" onchange="setPrice('${p.id}',this.value)"></td><td class="n">${(p.price/1000).toFixed(3)}</td><td><button onclick="delProd('${p.id}')">ลบ</button></td></tr>`).join('')}</table></div>`}
async function addProd(){const code=$('nc').value.trim(),name=$('nn').value.trim();if(!code||!name)return toast('กรอกให้ครบ');const{error}=await sb.from('products').insert({code,name,price_per_kg:+$('np').value||0,category:$('nk').value.trim()||'อื่นๆ',color:$('nl').value});if(error)return toast(error.message);await loadAll();rProd()}
async function setPrice(id,v){const{error}=await sb.from('products').update({price_per_kg:+v}).eq('id',id);if(error)return toast(error.message);await loadAll();rProd();toast('ปรับราคาแล้ว')}
async function delProd(id){if(!await dlg('ซ่อนสินค้านี้? บิลเก่ายังอยู่ครบ',{ok:'ซ่อน',danger:true}))return;await sb.from('products').update({active:false}).eq('id',id);await loadAll();rProd()}
// ---------- report ----------
function rRep(){const t=new Date().toISOString().slice(0,10);$('rep').innerHTML=`<div class="card row"><div><label>จาก</label><input id="rf" type="date" value="${t}"></div><div><label>ถึง</label><input id="rt" type="date" value="${t}"></div><button class="pri" onclick="runRep()">ดูรายงาน</button><button onclick="csv()">CSV</button></div><div id="ro"></div>`;runRep()}
function repB(){const f=new Date($('rf').value+'T00:00:00').getTime(),t=new Date($('rt').value+'T23:59:59').getTime();return B.filter(b=>b.status=='approved'&&b.ts>=f&&b.ts<=t)}
function runRep(){const bs=repB(),m={};bs.forEach(b=>b.lines.forEach(l=>{m[l.name]=m[l.name]||{net:0,amt:0};m[l.name].net+=l.net;m[l.name].amt+=l.amount}));
 $('ro').innerHTML=`<div class="card"><b>สรุป ${bs.length} บิล</b><div class="tot">฿${f2(bs.reduce((a,b)=>a+b.total,0))}</div><table><tr><th>สินค้า</th><th class="n">น้ำหนักสุทธิ (กก.)</th><th class="n">เป็นเงิน</th></tr>${Object.entries(m).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${f2(v.net)}</td><td class="n">${f2(v.amt)}</td></tr>`).join('')}</table></div>`}
function csv(){const rows=[['เลขที่','วันที่','ผู้ขาย','ผู้บันทึก','สินค้า','น้ำหนักรวม','หัก','สุทธิ','ราคา/กก.','เงิน']];repB().forEach(b=>b.lines.forEach(l=>rows.push([b.no,new Date(b.ts).toLocaleString('th-TH'),b.seller,b.recorder,l.name,l.gross,l.tare,l.net,l.price,l.amount])));
 dl('report.csv','\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
// ---------- settings ----------
function rSet(){$('set').innerHTML=`<div class="card g"><div><label>ชื่อร้าน (บนใบเสร็จ)</label><input id="s1" value="${esc(S.shop)}"></div><div><label>หน่วยที่ตาชั่งส่งมา</label><select id="s5"><option value="kg">กิโลกรัม</option><option value="g">กรัม</option></select></div></div>
<div class="card"><b>ภาชนะ/ตะกร้า</b><table>${T.map(t=>`<tr><td>${esc(t.n)}</td><td class="n">${t.w} กก.</td><td><button onclick="delTare('${t.id}')">ลบ</button></td></tr>`).join('')}</table>
<div class="row"><div><label>ชื่อ</label><input id="tn"></div><div><label>น้ำหนัก (กก.)</label><input id="tw" type="number" step="0.001"></div><button class="pri" onclick="addTare()">เพิ่ม</button></div></div>
<div class="card"><button class="pri" onclick="saveSet()">บันทึกตั้งค่า</button></div>`;$('s5').value=S.unit;$('set').insertAdjacentHTML('beforeend','<div class="card"><b>ผู้ใช้งาน</b><div id="ul"></div><div class="m" style="margin-top:6px">ผู้ใช้ใหม่เข้าสู่ระบบด้วยอีเมลและรหัสผ่านที่ตั้งไว้</div></div>');loadUsers();pinCard()}
function chPw(){const d=document.createElement('dialog');d.style.cssText='max-width:380px;width:92%;border-radius:12px;background:var(--c);color:var(--t)';
 d.innerHTML='<b>🔑 เปลี่ยนรหัสผ่านของฉัน</b><label style="margin-top:8px">รหัสผ่านใหม่ (6 ตัวขึ้นไป)</label><input id="pw1" type="password"><label style="margin-top:8px">ยืนยันรหัสผ่านใหม่</label><input id="pw2" type="password"><div id="pwe" class="m" style="color:var(--d);margin-top:6px"></div><div class="row" style="margin-top:10px"><button class="c">ยกเลิก</button><button class="pri o">บันทึก</button></div>';
 document.body.appendChild(d);d.showModal();d.querySelector('.c').onclick=()=>d.remove();
 d.querySelector('.o').onclick=async()=>{const a=d.querySelector('#pw1').value,b=d.querySelector('#pw2').value,e=d.querySelector('#pwe');if(a.length<6)return e.textContent='รหัสผ่านอย่างน้อย 6 ตัว';if(a!=b)return e.textContent='รหัสผ่านไม่ตรงกัน';
  const{error}=await sb.auth.updateUser({password:a});if(error)return e.textContent=error.message;d.remove();toast('เปลี่ยนรหัสผ่านแล้ว')}}
async function resetPw(id){const p=await dlg('ตั้งรหัสผ่านใหม่ให้ผู้ใช้นี้ (6 ตัวขึ้นไป)',{input:true,ph:'รหัสผ่านใหม่',ok:'เปลี่ยนรหัส'});if(!p)return;if(p.length<6)return toast('รหัสผ่านอย่างน้อย 6 ตัว');
 const{data,error}=await sb.functions.invoke('create-user',{body:{action:'reset',user_id:id,password:p}});let m=data?.error;if(error&&!m){m=error.message;try{m=(await error.context.json()).error||m}catch(e){}}if(m)return toast('ไม่สำเร็จ: '+m);credDlg(UE[id]||'',p,'✅ เปลี่ยนรหัสผ่านให้แล้ว')}
function pinCard(){$('set').insertAdjacentHTML('beforeend','<div class="card"><b>🔒 รหัส PIN แอดมิน (4 หลัก)</b><div class="m">ใช้ยืนยันเมื่อเปิดเมนูแอดมินหลังรีเฟรชหน้า/เปิดเครื่องใหม่ (เป็นด่านเสริมบนเครื่องหน้าร้าน ความปลอดภัยหลักยังอยู่ที่การล็อกอิน)</div><div class="row" style="margin-top:6px"><input id="npin" inputmode="numeric" maxlength="4" placeholder="เช่น 1234"><button class="pri" onclick="setPin()">ตั้ง/เปลี่ยน PIN</button></div></div>')}
async function setPin(){const p=$('npin').value.trim();if(!/^\d{4}$/.test(p))return toast('PIN ต้องเป็นตัวเลข 4 หลัก');const{error}=await sb.rpc('set_admin_pin',{p});toast(error?error.message:'ตั้ง PIN แล้ว');$('npin').value=''}
const NEWUSER=`<div style="margin-top:12px;border-top:1px solid var(--b);padding-top:10px"><b>➕ เพิ่มผู้ใช้</b><div class="g" style="margin-top:6px"><div><label>ชื่อ</label><input id="un"></div><div><label>อีเมล</label><input id="ue" type="email"></div><div><label>รหัสผ่าน (6 ตัวขึ้นไป)</label><input id="up"></div><div><label>บทบาท</label><select id="ur"><option value="clerk">User (เสมียน)</option><option value="cashier">ผู้จ่ายเงิน/บัญชี</option><option value="admin">Admin</option></select></div></div><button class="pri" style="margin-top:8px" onclick="addUser()">เพิ่มผู้ใช้</button></div>`;
async function addUser(){const body={name:$('un').value.trim(),email:$('ue').value.trim(),password:$('up').value,role:$('ur').value};if(!body.name||!body.email||body.password.length<6)return toast('กรอกชื่อ อีเมล และรหัสผ่านอย่างน้อย 6 ตัว');
 const{data,error}=await sb.functions.invoke('create-user',{body});let m=data?.error;if(error&&!m){m=error.message;try{m=(await error.context.json()).error||m}catch(e){}}
 if(m)return toast('เพิ่มไม่สำเร็จ: '+m);loadUsers();credDlg(body.email,body.password,'✅ เพิ่มผู้ใช้แล้ว')}
let UL=[],UE={};
async function fn(body){const{data,error}=await sb.functions.invoke('create-user',{body});let m=data?.error;if(error&&!m){m=error.message;try{m=(await error.context.json()).error||m}catch(e){}}return m||null}
function credDlg(email,pw,title){const t='อีเมลเข้าสู่ระบบ: '+email+'\nรหัสผ่าน: '+pw;
 return dlg(title,{body:`<div style="text-align:left;margin:8px 0;padding:10px;background:var(--bg);border-radius:8px;word-break:break-all">อีเมล: <b>${esc(email)}</b><br>รหัสผ่านชั่วคราว: <b>${esc(pw)}</b></div><div class="m">แจ้งพนักงาน แล้วให้เปลี่ยนรหัสเองที่ปุ่ม 🔑</div>`,ok:'📋 คัดลอก',no:'ปิด'}).then(ok=>{if(ok)navigator.clipboard?.writeText(t).then(()=>toast('คัดลอกแล้ว'))})}
async function loadUsers(){const[{data:ps},{data:es}]=await Promise.all([sb.from('profiles').select('*').order('name'),sb.from('user_emails').select('*')]);
 UE={};(es||[]).forEach(x=>UE[x.id]=x.email);UL=ps||[];
 $('ul').innerHTML='<div style="overflow-x:auto"><table><tr><th>ชื่อ</th><th>อีเมล (ใช้ล็อกอิน)</th><th>สิทธิ์</th><th>สถานะ</th><th></th></tr>'+UL.map(u=>{const me=u.id==ME.id,off=u.active===false;
  return `<tr style="${off?'opacity:.6':''}"><td><input value="${esc(u.name)}" onchange="setName('${u.id}',this.value)"></td><td style="word-break:break-all">${esc(UE[u.id]||'-')}</td>
  <td><select ${me?'disabled':''} onchange="setRole('${u.id}',this.value)">${Object.entries(RL).map(([k,v])=>`<option value="${k}" ${k==u.role?'selected':''}>${v}</option>`).join('')}</select></td>
  <td>${off?'<span class="bd void">ปิดใช้งาน</span>':'<span class="bd approved">ใช้งาน</span>'}</td>
  <td style="white-space:nowrap">${me?'<span class="m">(คุณ)</span>':`<button onclick="resetPw('${u.id}')">รีเซ็ตรหัส</button> <button onclick="toggleUser('${u.id}')">${off?'เปิดใช้งาน':'ปิดใช้งาน'}</button> <button class="ic del" aria-label="ลบผู้ใช้" onclick="delUser('${u.id}')">${TRASH}</button>`}</td></tr>`}).join('')+'</table></div><div class="m" style="margin-top:6px">สิทธิ์: User = ชั่ง/ดูสถานะบิลตัวเอง · ผู้จ่ายเงิน/บัญชี = จ่ายเงิน สต็อก รายงาน · Admin = ทุกเมนู<br>ระบบเก็บรหัสผ่านแบบเข้ารหัส ไม่มีใครดูรหัสเดิมได้ ถ้าพนักงานลืมให้กด "รีเซ็ตรหัส" แล้วแจ้งรหัสใหม่</div>'+NEWUSER}
async function toggleUser(id){const u=UL.find(x=>x.id==id),en=u.active===false;if(!en&&!await dlg('ปิดใช้งานบัญชี "'+u.name+'"? จะล็อกอินไม่ได้ (ข้อมูลบิลยังอยู่ครบ)',{ok:'ปิดใช้งาน',danger:true}))return;
 const m=await fn({action:'toggle',user_id:id,active:en});if(m)return toast('ไม่สำเร็จ: '+m);toast(en?'เปิดใช้งานแล้ว':'ปิดใช้งานแล้ว');loadUsers()}
async function delUser(id){const u=UL.find(x=>x.id==id);if(!await dlg('ลบผู้ใช้ "'+u.name+'" ถาวร? (ลบได้เฉพาะผู้ที่ยังไม่มีประวัติบิล)',{ok:'ลบผู้ใช้',danger:true}))return;
 const m=await fn({action:'delete',user_id:id});if(m)return toast(m);toast('ลบผู้ใช้แล้ว');loadUsers()}
async function setRole(id,r){const{error}=await sb.from('profiles').update({role:r}).eq('id',id);toast(error?error.message:'เปลี่ยนบทบาทแล้ว')}
async function setName(id,n){const{error}=await sb.from('profiles').update({name:n.trim()||'-'}).eq('id',id);toast(error?error.message:'แก้ชื่อแล้ว')}
function saveSet(){S.shop=$('s1').value;$('shopn').textContent=S.shop;S.unit=$('s5').value;localStorage.setItem('mk_set',JSON.stringify({shop:S.shop,unit:S.unit}));toast('บันทึกแล้ว')}
async function addTare(){const n=$('tn').value.trim(),w=+$('tw').value;if(!n||!(w>=0))return toast('กรอกให้ครบ');const{error}=await sb.from('tare_presets').insert({name:n,weight_kg:w});if(error)return toast(error.message);await loadAll();rSet()}
async function delTare(id){await sb.from('tare_presets').delete().eq('id',id);await loadAll();rSet()}
boot();
</script></body></html>
