 for(const[b,d,p,s]of[[9600,8,'none',1],[4800,8,'none',1],[2400,8,'none',1],[19200,8,'none',1],[9600,7,'even',1],[9600,8,'even',1],[1200,7,'even',1],[38400,8,'none',1],[115200,8,'none',1]]){
  toast('ทดสอบ '+b+' baud '+d+p[0].toUpperCase()+s+' ...');try{await port.open({baudRate:b,dataBits:d,parity:p,stopBits:s})}catch(e){continue}
  let txt='';const rd=port.readable.getReader(),to=setTimeout(()=>rd.cancel(),1600),dec=new TextDecoder('latin1');
  try{for(;;){const{value,done}=await rd.read();if(done)break;txt+=dec.decode(value)}}catch(e){}clearTimeout(to);try{rd.releaseLock()}catch(e){}try{await port.close()}catch(e){}
  const hits=txt.split(/[\r\n]+/).filter(x=>x.trim()&&/^[\x20-\x7e]+$/.test(x)&&parseW(x)).length;if(hits>=2&&(!best||hits>best.hits))best={b,d,p,s,hits}}

function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
// ---------- settings ----------
function rSet(){$('set').innerHTML=`<div class="card g"><div><label>ชื่อร้าน (บนใบเสร็จ)</label><input id="s1" value="${esc(S.shop)}"></div><div><label>แป้นพิมพ์บนหน้าจอ (เครื่องนี้)</label><select id="s6"><option value="auto">อัตโนมัติ (เฉพาะคอมทัชสกรีน)</option><option value="on">เปิดเสมอ</option><option value="off">ปิด</option></select></div></div>
<div class="card"><b>ภาชนะ/ตะกร้า</b><table>${T.map(t=>`<tr><td>${esc(t.n)}</td><td class="n">${t.w} กก.</td><td><button onclick="delTare('${t.id}')">ลบ</button></td></tr>`).join('')}</table>
<div class="row"><div><label>ชื่อ</label><input id="tn"></div><div><label>น้ำหนัก (กก.)</label><input id="tw" type="number" step="0.001"></div><button class="pri" onclick="addTare()">เพิ่ม</button></div></div>
<div class="card"><button class="pri" onclick="saveSet()">บันทึกตั้งค่า</button></div>`;$('s6').value=oskMode();$('set').insertAdjacentHTML('beforeend','<div class="card"><b>ผู้ใช้งาน</b><div id="ul"></div><div class="m" style="margin-top:6px">ผู้ใช้ใหม่เข้าสู่ระบบด้วยอีเมลและรหัสผ่านที่ตั้งไว้</div></div>');loadUsers();pinCard()}
function chPw(){const d=document.createElement('dialog');d.style.cssText='max-width:380px;width:92%;border-radius:12px;background:var(--c);color:var(--t)';
 d.innerHTML='<b>🔑 เปลี่ยนรหัสผ่านของฉัน</b><label style="margin-top:8px">รหัสผ่านใหม่ (6 ตัวขึ้นไป)</label><input id="pw1" type="password"><label style="margin-top:8px">ยืนยันรหัสผ่านใหม่</label><input id="pw2" type="password"><div id="pwe" class="m" style="color:var(--d);margin-top:6px"></div><div class="row" style="margin-top:10px"><button class="c">ยกเลิก</button><button class="pri o">บันทึก</button></div>';
 document.body.appendChild(d);d.showModal();d.querySelector('.c').onclick=()=>d.remove();
 d.querySelector('.o').onclick=async()=>{const a=d.querySelector('#pw1').value,b=d.querySelector('#pw2').value,e=d.querySelector('#pwe');if(a.length<6)return e.textContent='รหัสผ่านอย่างน้อย 6 ตัว';if(a!=b)return e.textContent='รหัสผ่านไม่ตรงกัน';
  const{error}=await sb.auth.updateUser({password:a});if(error)return e.textContent=error.message;d.remove();toast('เปลี่ยนรหัสผ่านแล้ว')}}
async function resetPw(id){const p=await dlg('ตั้งรหัสผ่านใหม่ให้ผู้ใช้นี้ (6 ตัวขึ้นไป)',{input:true,ph:'รหัสผ่านใหม่',ok:'เปลี่ยนรหัส'});if(!p)return;if(p.length<6)return toast('รหัสผ่านอย่างน้อย 6 ตัว');
 const{data,error}=await sb.functions.invoke('create-user',{body:{action:'reset',user_id:id,password:p}});let m=data?.error;if(error&&!m){m=error.message;try{m=(await error.context.json()).error||m}catch(e){}}if(m)return toast('ไม่สำเร็จ: '+m);credDlg(UE[id]||'',p,'✅ เปลี่ยนรหัสผ่านให้แล้ว')}
function pinCard(){$('set').insertAdjacentHTML('beforeend','<div class="card"><b>🔒 รหัส PIN แอดมิน (4 หลัก)</b><div class="m">ใช้ยืนยันเมื่อเปิดเมนูแอดมินหลังรีเฟรชหน้า/เปิดเครื่องใหม่ (เป็นด่านเสริมบนเครื่องหน้าร้าน ความปลอดภัยหลักยังอยู่ที่การล็อกอิน)</div><div class="row" style="margin-top:6px"><input id="npin" inputmode="numeric" maxlength="4" placeholder="เช่น 1234"><button class="pri" onclick="setPin()">ตั้ง/เปลี่ยน PIN</button></div></div>')}
async function setPin(){const p=$('npin').value.trim();if(!/^\d{4}$/.test(p))return toast('PIN ต้องเป็นตัวเลข 4 หลัก');const{error}=await sb.rpc('set_admin_pin',{p});toast(error?error.message:'ตั้ง PIN แล้ว');$('npin').value=''}
const NEWUSER=`<div style="margin-top:12px;border-top:1px solid var(--b);padding-top:10px"><b>➕ เพิ่มผู้ใช้</b><div class="g" style="margin-top:6px"><div><label>ชื่อ</label><input id="un"></div><div><label>อีเมล</label><input id="ue" type="email"></div><div><label>รหัสผ่าน (6 ตัวขึ้นไป)</label><input id="up"></div><div><label>บทบาท</label><select id="ur"><option value="clerk">User (เสมียน)</option><option value="cashier">ผู้จ่ายเงิน/บัญชี</option><option value="admin">Admin</option></select></div></div><button class="pri" style="margin-top:8px" onclick="addUser()">เพิ่มผู้ใช้</button></div>`;
async function addUser(){const body={name:$('un').value.trim(),email:$('ue').value.trim(),password:$('up').value,role:$('ur').value};if(!body.name||!body.email||body.password.length<6)return toast('กรอกชื่อ อีเมล และรหัสผ่านอย่างน้อย 6 ตัว');
 const{data,error}=await sb.functions.invoke('create-user',{body});let m=data?.error;if(error&&!m){m=error.message;try{m=(await error.context.json()).error||m}catch(e){}}
 if(m)return toast('เพิ่มไม่สำเร็จ: '+m);loadUsers();credDlg(body.email,body.password,'✅ เพิ่มผู้ใช้แล้ว')}
let UL=[],UE={};
async function fn(body){const{data,error}=await sb.functions.invoke('create-user',{body});let m=data?.error;if(error&&!m){m=error.message;try{m=(await error.context.json()).error||m}catch(e){}}return m||null}
function credDlg(email,pw,title){const t='อีเมลเข้าสู่ระบบ: '+email+'\nรหัสผ่าน: '+pw;
 return dlg(title,{body:`<div style="text-align:left;margin:8px 0;padding:10px;background:var(--bg);border-radius:8px;word-break:break-all">อีเมล: <b>${esc(email)}</b><br>รหัสผ่านชั่วคราว: <b>${esc(pw)}</b></div><div class="m">แจ้งพนักงาน แล้วให้เปลี่ยนรหัสเองที่ปุ่ม 🔑</div>`,ok:'📋 คัดลอก',no:'ปิด'}).then(ok=>{if(ok)navigator.clipboard?.writeText(t).then(()=>toast('คัดลอกแล้ว'))})}
async function loadUsers(){const[{data:ps},{data:es}]=await Promise.all([sb.from('profiles').select('*').order('name'),sb.from('user_emails').select('*')]);
 UE={};(es||[]).forEach(x=>UE[x.id]=x.email);UL=ps||[];
 $('ul').innerHTML='<div style="overflow-x:auto"><table><tr><th>ชื่อ</th><th>อีเมล (ใช้ล็อกอิน)</th><th>สิทธิ์</th><th>สถานะ</th><th></th></tr>'+UL.map(u=>{const me=u.id==ME.id,off=u.active===false;
  return `<tr style="${off?'opacity:.6':''}"><td><input value="${esc(u.name)}" onchange="setName('${u.id}',this.value)"></td><td style="word-break:break-all">${esc(UE[u.id]||'-')}</td>
  <td><select ${me?'disabled':''} onchange="setRole('${u.id}',this.value)">${Object.entries(RL).map(([k,v])=>`<option value="${k}" ${k==u.role?'selected':''}>${v}</option>`).join('')}</select></td>
  <td>${off?'<span class="bd void">ปิดใช้งาน</span>':'<span class="bd approved">ใช้งาน</span>'}</td>
  <td style="white-space:nowrap">${me?'<span class="m">(คุณ)</span>':`<button onclick="resetPw('${u.id}')">รีเซ็ตรหัส</button> <button onclick="toggleUser('${u.id}')">${off?'เปิดใช้งาน':'ปิดใช้งาน'}</button> <button class="ic del" aria-label="ลบผู้ใช้" onclick="delUser('${u.id}')">${TRASH}</button>`}</td></tr>`}).join('')+'</table></div><div class="m" style="margin-top:6px">สิทธิ์: User = ชั่ง/ดูสถานะบิลตัวเอง · ผู้จ่ายเงิน/บัญชี = จ่ายเงิน สต็อก รายงาน · Admin = ทุกเมนู<br>ระบบเก็บรหัสผ่านแบบเข้ารหัส ไม่มีใครดูรหัสเดิมได้ ถ้าพนักงานลืมให้กด "รีเซ็ตรหัส" แล้วแจ้งรหัสใหม่</div>'+NEWUSER}
async function toggleUser(id){const u=UL.find(x=>x.id==id),en=u.active===false;if(!en&&!await dlg('ปิดใช้งานบัญชี "'+u.name+'"? จะล็อกอินไม่ได้ (ข้อมูลบิลยังอยู่ครบ)',{ok:'ปิดใช้งาน',danger:true}))return;
 const m=await fn({action:'toggle',user_id:id,active:en});if(m)return toast('ไม่สำเร็จ: '+m);toast(en?'เปิดใช้งานแล้ว':'ปิดใช้งานแล้ว');loadUsers()}
async function delUser(id){const u=UL.find(x=>x.id==id);if(!await dlg('ลบผู้ใช้ "'+u.name+'" ถาวร? (ลบได้เฉพาะผู้ที่ยังไม่มีประวัติบิล)',{ok:'ลบผู้ใช้',danger:true}))return;
 const m=await fn({action:'delete',user_id:id});if(m)return toast(m);toast('ลบผู้ใช้แล้ว');loadUsers()}
async function setRole(id,r){const{error}=await sb.from('profiles').update({role:r}).eq('id',id);toast(error?error.message:'เปลี่ยนบทบาทแล้ว')}
async function setName(id,n){const{error}=await sb.from('profiles').update({name:n.trim()||'-'}).eq('id',id);toast(error?error.message:'แก้ชื่อแล้ว')}
function saveSet(){S.shop=$('s1').value;$('shopn').textContent=S.shop;localStorage.setItem('mk_osk',$('s6').value);localStorage.setItem('mk_set',JSON.stringify({shop:S.shop,unit:S.unit}));toast('บันทึกแล้ว')}
async function addTare(){const n=$('tn').value.trim(),w=+$('tw').value;if(!n||!(w>=0))return toast('กรอกให้ครบ');const{error}=await sb.from('tare_presets').insert({name:n,weight_kg:w});if(error)return toast(error.message);await loadAll();rSet()}
async function delTare(id){await sb.from('tare_presets').delete().eq('id',id);await loadAll();rSet()}
boot();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('PWA Service Worker registered'))
      .catch(err => console.warn('PWA service worker:', err));
  });
}
</script>
</body></html>
